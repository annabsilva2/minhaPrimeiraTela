<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolos da Jú</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <main class="telas">

    <!-- TELA 1: LOGIN -->
    <section class="tela" id="login">
      <img class="logo" src="img/logo.png" alt="Logo Bolos da Jú">
      <h1>LOGIN</h1>
      <form>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha">
        <div class="botoes">
          <button type="submit" class="btn vermelho">Entrar</button>
          <a href="#cadastro" class="btn rosa">Cadastre-se</a>
        </div>
      </form>
      <p class="link">Esqueceu sua senha? <a href="#recuperar">Recupere aqui</a></p>
      <a class="politica" href="#">Política de Privacidade</a>
    </section>

    <!-- TELA 2: CADASTRO -->
    <section class="tela" id="cadastro">
      <img class="logo" src="img/logo.png" alt="Logo Bolos da Jú">
      <h1>CADASTRO</h1>
      <form>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome">
        <label for="cpf2">CPF</label>
        <input type="text" id="cpf2" placeholder="000.000.000-00" inputmode="numeric">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@email.com">
        <label for="senha2">Senha</label>
        <input type="password" id="senha2" placeholder="Crie uma senha">
        <div class="botoes">
          <button type="submit" class="btn vermelho">Cadastrar</button>
          <a href="#login" class="btn rosa">Voltar</a>
        </div>
      </form>
      <a class="politica" href="#">Política de Privacidade</a>
    </section>

    <!-- TELA 3: RECUPERAR SENHA -->
    <section class="tela" id="recuperar">
      <img class="logo" src="img/logo.png" alt="Logo Bolos da Jú">
      <h1>RECUPERAR SENHA</h1>
      <form>
        <label for="cpf3">CPF</label>
        <input type="text" id="cpf3" placeholder="000.000.000-00" inputmode="numeric">
        <label for="email2">E-mail cadastrado</label>
        <input type="email" id="email2" placeholder="voce@email.com">
        <div class="botoes">
          <button type="submit" class="btn vermelho">Enviar link</button>
          <a href="#login" class="btn rosa">Voltar</a>
        </div>
      </form>
      <a class="politica" href="#">Política de Privacidade</a>
    </section>

  </main>
</body>
</html>
